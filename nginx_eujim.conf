# Nginx Production Configuration Template for Eujim Solutions Portal
# Copy or symlink this file to /etc/nginx/sites-available/ and link to /etc/nginx/sites-enabled/

upstream django_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Maximum file upload size (matches / exceeds MEDIA upload limits)
    client_max_body_size 50M;

    # Log files
    access_log /var/log/nginx/eujim_access.log;
    error_log /var/log/nginx/eujim_error.log;

    # 1. Static Files
    location /static/ {
        alias /path/to/EujimSolutionsPortal/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Media Uploads
    location /media/ {
        alias /path/to/EujimSolutionsPortal/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. WebSocket connections (Django Channels)
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # 24 hours keep-alive for WebSockets
    }

    # 4. Django REST API & Application Proxying
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
